<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R.H.S — Comunidades</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="topo">
    <div class="container">
      <img id="logoHeader" src="img/logo.svg" alt="Logo" class="logo">
      <h1 id="tituloHeader">R.H.S</h1>
      <span id="descricaoHeader" class="tagline">Sistema de comunidades premium</span>
    </div>
  </header>

  <!-- ====== CONTEÚDO PRINCIPAL ====== -->
  <main class="container">

    <!-- Botão de recarregar -->
    <div style="text-align:right; margin-bottom:12px;">
      <button class="secondary-btn" onclick="carregarDados()">⟳ Atualizar</button>
    </div>

    <!-- Comunidades VIP -->
    <section id="vipSection" style="display:none;">
      <h2>⭐ VIP</h2>
      <div id="listaVip" class="grid"></div>
    </section>

    <!-- Comunidades normais -->
    <section>
      <h2>📢 Comunidades</h2>
      <div id="listaComunidades" class="grid"></div>
    </section>

    <!-- Aliados -->
    <section id="aliadosSection" style="display:none;">
      <h2>🤝 Aliados</h2>
      <div id="listaAliados" class="grid"></div>
    </section>

    <!-- ADMs -->
    <section id="admsSection" style="display:none;">
      <h2>👑 ADMs de Parceria</h2>
      <div id="listaAdms" class="lista-adms"></div>
    </section>

    <!-- Música de fundo (se configurada) -->
    <audio id="musicaFundo" loop style="display:none;"></audio>

  </main>

  <!-- ====== FOOTER ====== -->
  <footer class="rodape">
    <div class="container">
      <p id="footerTexto">© 2026 R.H.S — Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- ====== SCRIPTS ====== -->
  <script src="js/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R.H.S</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="matrix"></canvas>



<audio id="music" loop>

<source src="audio/music.mp3" type="audio/mpeg">

</audio>







<!-- ENTRADA -->

<section id="welcome">


<div class="welcome-card">


<img src="img/logo.png" class="logo">


<h1>
R.H.S
</h1>


<p>
Comunidades, canais e parceiros.
</p>


<button id="entrar">
Entrar
</button>


</div>


</section>









<!-- SITE -->


<main id="site">





<header class="top">


<img 
id="logoPrincipal"
class="main-logo"
src="img/logo.png"
>



<h1 id="nomePrincipal">
R.H.S Oficial
</h1>



<p>
Central de comunidades
</p>



<a 
id="linkPrincipal"
class="main-button"
target="_blank"
>

Acessar Canal

</a>


</header>









<!-- PESQUISA -->


<section class="search-box">


<input 
id="pesquisa"
placeholder="Pesquisar..."
>


</section>










<!-- GRUPOS -->


<section class="catalog">


<h2>
👥 Grupos
</h2>



<div 
id="grupos"
class="cards"
>

</div>



</section>









<!-- CANAIS -->


<section class="catalog">


<h2>
📢 Canais
</h2>



<div 
id="canais"
class="cards"
>

</div>



</section>









<!-- VIP -->


<section class="catalog">


<h2>
⭐ VIP
</h2>



<div 
id="vip"
class="cards"
>

</div>



</section>









<!-- PARCEIROS -->


<section class="catalog">


<h2>
🤝 Parceiros
</h2>



<div 
id="parceiros"
class="cards"
>

</div>



</section>









<footer>

R.H.S © 2026

</footer>



</main>






<script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>

<html lang="pt-BR">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>R.H.S ADM</title>


<link rel="stylesheet" href="admin.css">


</head>



<body>




<div id="login" class="box">



<h1>

R.H.S

</h1>



<p>

Painel Administrativo

</p>



<input

id="senha"

type="password"

placeholder="Senha"

>




<button onclick="entrarADM()">

Entrar

</button>



</div>









<div id="painel" style="display:none;">



<header>


<h1>

R.H.S ADM

</h1>


<p>

Gerenciar catálogo

</p>


</header>









<section class="box">


<h2>

➕ Nova Comunidade

</h2>




<select id="tipo">


<option value="grupos">

👥 Grupo

</option>



<option value="canais">

📢 Canal

</option>



<option value="vip">

⭐ VIP

</option>



<option value="parceiros">

🤝 Parceiro

</option>


</select>








<input

id="nome"

placeholder="Nome"

>








<input

id="imagem"

placeholder="URL da foto"

>








<input
id="link"
placeholder="Link WhatsApp/Site"
>


<button onclick="buscarFoto()">

📷 Buscar foto

</button>


<button onclick="buscarInfo()">

🔎 Buscar dados

</button>








<select id="categoria">


<option>

Amizade

</option>


<option>

Jogos

</option>


<option>

Programação

</option>


<option>

Divulgação

</option>


<option>

Outros

</option>


</select>








<textarea

id="descricao"

placeholder="Descrição"

></textarea>








<button onclick="salvarItem()">

Publicar

</button>



</section>









<section class="box">


<h2>

📦 Itens cadastrados

</h2>



<div id="listaAdmin">


</div>



</section>


<section class="box">

<h2>
🚀 Publicação
</h2>


<button onclick="publicar()">

🚀 Atualizar Site

</button>


</section>





<button onclick="sair()" class="exit">

Sair

</button>




</div>







<script src="admin.js"></script>



</body>


</html>
